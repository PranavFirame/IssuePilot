<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="borderShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle card -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#bg)"/>
  <rect x="1" y="1" width="30" height="30" rx="8" fill="none" stroke="url(#borderShine)" stroke-width="1.2"/>

  <!-- Compass Outer Ring -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

  <!-- North Needle Half (Bright White) -->
  <polygon points="16,16 22,10 17.8,17.8" fill="#ffffff"/>
  <polygon points="16,16 22,10 14.2,14.2" fill="#e0e7ff"/>

  <!-- South Needle Half (Indigo Accented) -->
  <polygon points="16,16 10,22 14.2,14.2" fill="#c7d2fe"/>
  <polygon points="16,16 10,22 17.8,17.8" fill="#818cf8"/>

  <!-- Compass Center Pivot -->
  <circle cx="16" cy="16" r="2" fill="#ffffff"/>
  <circle cx="16" cy="16" r="1" fill="#4f46e5"/>
</svg>
